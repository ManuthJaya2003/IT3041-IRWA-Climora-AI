version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climora-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/climora
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app  # Hot-reload for development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - climora-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climora-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - climora-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: climora-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: climora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - climora-network

volumes:
  postgres_data:

networks:
  climora-network:
    driver: bridge
